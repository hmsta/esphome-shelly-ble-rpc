# Firmware 2.0+ bonded-mode example; not yet field tested.
# Open BLE.StartPairing on the Shelly before establishing the first bond.
# Standalone local-checkout example. Set Wi-Fi credentials and the Shelly BLE MAC
# before flashing. See README.md for installation directly from GitHub.
esphome:
  name: shelly-bonded-ble-test
  min_version: 2026.8.2

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
    version: 5.5.5

external_components:
  - source:
      type: local
      path: ../components
    components: [shelly_ble_rpc]

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: "REPLACE_WITH_WIFI_SSID"
  password: "REPLACE_WITH_WIFI_PASSWORD"

# Stack-wide security settings for Just Works bonding.
esp32_ble:
  io_capability: none
  auth_req_mode: bond

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - id: shelly_bonded_client
    # Bluetooth MAC from the Shelly Bluetooth settings (not its Wi-Fi MAC).
    mac_address: AA:BB:CC:DD:EE:FF

shelly_ble_rpc:
  id: shelly_bonded
  ble_client_id: shelly_bonded_client
  update_interval: 5s
  response_timeout: 5s
  pairing: true
  pairing_timeout: 30s
  input_0:
    name: "Shelly Input 1"
    # Optional: require observed ON for ten seconds; OFF is not delayed.
    # on_delay: 10s
  connected:
    name: "Shelly Polling Healthy"
