name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch ArduinoJson headers
        run: git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git .cache/ArduinoJson
      - name: Run configuration and native tests
        env:
          ARDUINOJSON_INCLUDE: ${{ github.workspace }}/.cache/ArduinoJson/src
          CXX: g++
        run: python -m pytest tests -q
